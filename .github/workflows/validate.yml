name: Validate reviewed source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-reviewed-source:
    name: validate-reviewed-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/validate_source.py origin/main
